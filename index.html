<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Quiz Nepal</title>

  <meta name="description"
        content="Quiz Nepal - Class 10, Class 11, General Knowledge and One vs One Quiz">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       PAGE 1 : GOOGLE LOGIN
  ========================== -->
  <section id="loginPage" class="page login-page">

    <div class="login-overlay"></div>

    <div class="login-box">

      <div class="logo-icon">📚</div>

      <h1>Quiz Nepal</h1>

      <p class="tagline">
        Learn • Practice • Compete
      </p>

      <div class="mahadev-login">
        हर हर महादेव 🔱
      </div>

      <p class="login-title">
        Google Account बाट Login गर्नुहोस्
      </p>

      <button
        id="googleLoginBtn"
        class="google-button"
        type="button">

        <span class="google-g">G</span>

        <span>
          Continue with Google
        </span>

      </button>

      <p id="loginMessage" class="login-message"></p>

    </div>

  </section>


  <!-- =========================
       PAGE 2 : HOME
  ========================== -->
  <section id="homePage" class="page home-page">

    <header class="topbar">

      <div class="site-name">
        Quiz Nepal
      </div>

      <div class="top-buttons">

        <button
          id="neBtn"
          class="language-btn active"
          type="button">
          नेपाली 🇳🇵
        </button>

        <button
          id="enBtn"
          class="language-btn"
          type="button">
          English 🇬🇧
        </button>

        <button
          id="bothBtn"
          class="language-btn"
          type="button">
          दुवै
        </button>

        <button
          id="logoutBtn"
          class="logout-button"
          type="button">
          Logout
        </button>

      </div>

    </header>


    <main class="home-container">

      <!-- MAHADEV -->
      <div class="mahadev-section">

        <div class="mahadev-text">
          हर हर महादेव 🔱
        </div>

        <div class="creator-text">
          Lok Raj Awasthi
        </div>

        <div id="userEmail" class="user-email"></div>

      </div>


      <h2 id="chooseTitle" class="choose-title">
        आफ्नो Quiz छान्नुहोस्
      </h2>


      <!-- 4 CATEGORIES -->
      <div class="category-container">

        <!-- CLASS 10 -->
        <button
          class="category-card class10"
          data-category="class10"
          type="button">

          <span class="category-icon">📘</span>

          <span class="ne-text">
            कक्षा १०
          </span>

          <span class="en-text">
            Class 10
          </span>

        </button>


        <!-- CLASS 11 -->
        <button
          class="category-card class11"
          data-category="class11"
          type="button">

          <span class="category-icon">📗</span>

          <span class="ne-text">
            कक्षा ११
          </span>

          <span class="en-text">
            Class 11
          </span>

        </button>


        <!-- GK -->
        <button
          class="category-card gk"
          data-category="gk"
          type="button">

          <span class="category-icon">🧠</span>

          <span class="ne-text">
            सामान्य ज्ञान
          </span>

          <span class="en-text">
            General Knowledge
          </span>

        </button>


        <!-- ONE VS ONE -->
        <button
          class="category-card one"
          data-category="one"
          type="button">

          <span class="category-icon">⚔️</span>

          <span class="ne-text">
            एक विरुद्ध एक
          </span>

          <span class="en-text">
            One vs One
          </span>

        </button>

      </div>

    </main>

  </section>


  <!-- =========================
       PAGE 3 : SUBJECT
  ========================== -->
  <section id="subjectPage" class="page">

    <header class="inside-header">

      <button
        id="subjectBackBtn"
        class="back-button"
        type="button">
        ← Back
      </button>

      <h2 id="subjectTitle">
        Subjects
      </h2>

      <div></div>

    </header>

    <main class="inside-container">

      <div
        id="subjectList"
        class="selection-list">
      </div>

    </main>

  </section>


  <!-- =========================
       PAGE 4 : CHAPTER
  ========================== -->
  <section id="chapterPage" class="page
