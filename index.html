<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awasthi Quiz Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <!-- 1. Login Screen -->
        <div id="login-screen" class="screen active">
            <div class="card login-card">
                <div class="logo">🎓</div>
                <h1>Awasthi Quiz</h1>
                <p class="subtitle">ज्ञानको परीक्षा दिनुहोस्</p>
                <form id="login-form">
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="access-name" placeholder="आफ्नो नाम लेख्नुहोस्..." required>
                    </div>
                    <button type="submit" class="btn-primary">सुरु गर्नुहोस् <i class="fas fa-arrow-right"></i></button>
                </form>
            </div>
        </div>

        <!-- 2. Category (Class) Screen -->
        <div id="category-screen" class="screen">
            <div class="header">
                <h2>नमस्ते, <span id="display-name">Student</span>! 👋</h2>
                <p>आफ्नो Class छान्नुहोस्</p>
            </div>
            <div class="grid-container" id="class-list">
                <!-- Classes loaded by JS -->
            </div>
        </div>

        <!-- 3. Subject Screen -->
        <div id="subject-screen" class="screen">
            <div class="header">
                <button class="btn-back" onclick="showScreen('category-screen')"><i class="fas fa-arrow-left"></i> पछाडि</button>
                <h2 id="subject-title">Subjects</h2>
            </div>
            <div class="grid-container" id="subject-list"></div>
        </div>

        <!-- 4. Chapter Screen -->
        <div id="chapter-screen" class="screen">
            <div class="header">
                <button class="btn-back" onclick="showScreen('subject-screen')"><i class="fas fa-arrow-left"></i> पछाडि</button>
                <h2 id="chapter-title">Chapters</h2>
            </div>
            <div class="list-container" id="chapter-list"></div>
        </div>

        <!-- 5. Quiz Screen -->
        <div id="quiz-screen" class="screen">
            <div class="quiz-header">
                <div class="player-info">
                    <i class="fas fa-user-circle"></i> <span id="current-player">Player</span>
                </div>
                <div class="score-badge">
                    <i class="fas fa-star"></i> <span id="current-score">0</span>
                </div>
            </div>
           
            <div class="timer-container">
                <div class="timer-info">
                    <span id="question-counter">1/10</span>
                    <span class="timer-badge"><i class="fas fa-clock"></i> <span id="time-left">30</span>s</span>
                </div>
                <div class="timer-bar"><div id="timer-progress" class="timer-progress"></div></div>
            </div>
           
            <div class="question-box">
                <p id="question-text">प्रश्न यहाँ देखिनेछ...</p>
            </div>
            <div id="options-container" class="options-grid"></div>
            <p id="answer-feedback" class="feedback"></p>
        </div>

        <!-- 6. Result Screen -->
        <div id="result-screen" class="screen">
            <div class="card result-card">
                <div class="result-icon">🏆</div>
                <h2>नतिजा</h2>
                <div class="score-circle">
                    <span id="final-score">0</span>
                    <span class="total-score" id="total-q">/ 100</span>
                </div>
                <p id="score-message" class="message"></p>
                <div class="stats">
                    <span class="stat-item text-green"><i class="fas fa-check-circle"></i> सही: <span id="correct-count">0</span></span>
                    <span class="stat-item text-red"><i class="fas fa-times-circle"></i> गलत: <span id="wrong-count">0</span></span>
                </div>
               
                <button id="toggle-review-btn" class="btn-secondary" onclick="toggleReview()"><i class="fas fa-eye"></i> उत्तर हेर्नुहोस्</button>
                <div id="review-container" class="hidden review-box"></div>
               
                <div class="btn-group">
                    <button class="btn-primary" onclick="restartGame()"><i class="fas fa-redo"></i> पुनः खेल्नुहोस्</button>
                    <button class="btn-danger" onclick="quitQuiz()"><i class="fas fa-sign-out-alt"></i> छोड्नुहोस्</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
