<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Quiz Nepal</title>

  <meta
    name="description"
    content="Quiz Nepal - Class 10, Class 11, General Knowledge and One vs One Quiz"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <!-- =====================================================
       BACKGROUND
  ====================================================== -->

  <div class="background-overlay"></div>


  <!-- =====================================================
       MAIN APP
  ====================================================== -->

  <main id="app">


    <!-- ===================================================
         LOGIN PAGE
    ==================================================== -->

    <section
      id="loginPage"
      class="page login-page active"
    >

      <div class="login-card">

        <div class="mahadev-symbol">
          🔱
        </div>

        <h1>
          Quiz Nepal
        </h1>

        <h2>
          हर हर महादेव 🔱
        </h2>

        <p class="login-subtitle">
          Quiz Nepal मा स्वागत छ
        </p>

        <p class="login-subtitle en-text">
          Welcome to Quiz Nepal
        </p>


        <button
          id="googleLoginBtn"
          type="button"
          class="google-login-btn"
        >

          <span class="google-icon">
            G
          </span>

          <span>
            Continue with Google
          </span>

        </button>


        <p
          id="loginMessage"
          class="login-message"
        ></p>


        <div class="creator-box">

          <span>
            Created by
          </span>

          <strong>
            Lok Raj Awasthi
          </strong>

        </div>

      </div>

    </section>



    <!-- ===================================================
         HOME PAGE
    ==================================================== -->

    <section
      id="homePage"
      class="page home-page"
    >

      <header class="top-header">

        <div class="brand">

          <div class="brand-symbol">
            🔱
          </div>

          <div>

            <h1>
              Mahadev
            </h1>

            <p>
              हर हर महादेव 🔱
            </p>

          </div>

        </div>


        <div class="user-area">

          <span id="userEmail"></span>

          <button
            id="logoutBtn"
            type="button"
            class="logout-btn"
          >
            Logout
          </button>

        </div>

      </header>



      <!-- LANGUAGE -->

      <div class="language-switch">

        <button
          id="neBtn"
          type="button"
        >
          नेपाली 🇳🇵
        </button>

        <button
          id="enBtn"
          type="button"
        >
          English 🇬🇧
        </button>

        <button
          id="bothBtn"
          type="button"
          class="active"
        >
          दुवै / Both
        </button>

      </div>



      <!-- WELCOME -->

      <div class="welcome-box">

        <h2 id="chooseTitle">
          आफ्नो Quiz छान्नुहोस्
        </h2>

        <p id="chooseDescription">
          आफ्नो कक्षा वा Quiz category छानेर अभ्यास सुरु गर्नुहोस्।
        </p>

      </div>



      <!-- STATS -->

      <div class="stats-container">

        <div class="stat-card">

          <span
            id="gamesPlayedLabel"
            class="stat-label"
          >
            खेलेका Quiz
          </span>

          <strong id="gamesPlayedStat">
            0
          </strong>

        </div>


        <div class="stat-card">

          <span
            id="bestScoreLabel"
            class="stat-label"
          >
            उत्कृष्ट Score
          </span>

          <strong id="bestScoreStat">
            0
          </strong>

        </div>


        <div class="stat-card">

          <span
            id="correctLabel"
            class="stat-label"
          >
            कुल सही
          </span>

          <strong id="correctStat">
            0
          </strong>

        </div>


        <div class="stat-card">

          <span
            id="wrongLabel"
            class="stat-label"
          >
            कुल गलत
          </span>

          <strong id="wrongStat">
            0
          </strong>

        </div>

      </div>



      <!-- QUIZ CATEGORIES -->

      <div class="category-grid">


        <!-- CLASS 10 -->

        <button
          type="button"
          class="category-card"
          data-category="class10"
        >

          <div class="category-icon
